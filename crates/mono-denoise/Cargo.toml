[package]
name = "mono-denoise"
version.workspace = true
description = "Monocard: profiled, raw wavelet, and learned denoise on one plane"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mono-core = { path = "../mono-core" }
greycard-core = { path = "../greycard-core" }
greycard-ai = { path = "../greycard-ai" }
rayon.workspace = true
thiserror.workspace = true
log.workspace = true
# The session's types, as greycard-ai's runtime hands them out.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "api-27",
    "load-dynamic",
] }
