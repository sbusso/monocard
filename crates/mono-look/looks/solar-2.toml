# and JPEG pair; the result goes in SOLAR in crates/mono-look/src/finish.rs.
name = "Solar 2"
description = "Tone reversed at both ends. Uncalibrated: not yet matched to the camera."

[tools.solarize]
kind = "ends"
strength = 1
