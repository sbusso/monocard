[package]
name = "greycard-cli"
version.workspace = true
description = "Command-line RAW pre-processor built on greycard-core"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "greycard"

[lints]
workspace = true

[[bin]]
name = "greycard"
path = "src/main.rs"

# The same program under Monocard's name; its tests are the one above's.
# The path is spelled another way so that cargo does not warn, at every
# command, of one file in two targets.
[[bin]]
name = "monocard"
path = "../greycard-cli/src/main.rs"
required-features = ["mono"]
test = false

[dependencies]
mono-core = { path = "../mono-core", optional = true }
mono-profile = { path = "../mono-profile", optional = true }
mono-look = { path = "../mono-look", optional = true }
greycard-core = { path = "../greycard-core" }
greycard-version = { path = "../greycard-version" }
greycard-ai = { path = "../greycard-ai" }
greycard-lens = { path = "../greycard-lens" }
greycard-edit = { path = "../greycard-edit" }
greycard-edit-io = { path = "../greycard-edit-io" }
greycard-library = { path = "../greycard-library" }
# The editor's export with no window, and the settings it reads.
greycard-engine = { path = "../greycard-engine" }
# The export's own device, which the engine is lent and never makes.
greycard-gpu = { path = "../greycard-gpu" }
image.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

[dev-dependencies]
# The scratch folder's removal the tests share.
greycard-core = { path = "../greycard-core", features = ["testing"] }
# Frames with real EXIF for the listing's tests.
greycard-library = { path = "../greycard-library", features = ["fixtures"] }

[features]
# Monocard, the monochrome build (docs/monocard).
mono = ["dep:mono-core", "dep:mono-profile", "dep:mono-look", "greycard-engine/mono"]
# Nikon High Efficiency raws; off by default, see greycard-core.
nikon-he = ["greycard-core/nikon-he"]

# The icon and the version fields Explorer and the file properties
# sheet read out of the executable itself. Windows only: every other
# desktop takes its icon from the .desktop entry or the bundle beside
# the binary.
[target."cfg(windows)".build-dependencies]
winresource.workspace = true
