# Monocard's own checks (docs/monocard): the `mono` build's lint and
# targeted tests, the stock build still building and free of mono code,
# the golden renders, and the license and trademark scan. Greycard's
# ci.yml runs beside it, on the stock build, as it comes from upstream.
name: Monocard

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # lavapipe, the runner's only adapter; see ci.yml.
  WGPU_BACKEND: vulkan
  MONO_CRATES: >-
    -p mono-core -p mono-decode -p mono-denoise -p mono-tone -p mono-look
    -p mono-profile -p mono-ui
  # Every Greycard crate with the feature.
  FEATURE_CRATES: >-
    -p greycard-core -p greycard-edit -p greycard-edit-io -p greycard-ai
    -p greycard-lens -p greycard-gpu -p greycard-library -p greycard-render
    -p greycard-engine -p greycard-viewport -p greycard-slint -p greycard-ui
    -p greycard-cli

jobs:
  mono:
    name: fmt, clippy, test (mono)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - &room
        name: Room to build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - &native
        name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liblcms2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            pkg-config mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --check
      - name: clippy, the mono crates
        run: cargo clippy --locked $MONO_CRATES --all-targets -- -D warnings
      - name: clippy, Greycard's crates with mono
        run: cargo clippy --locked $FEATURE_CRATES --features mono --all-targets -- -D warnings
      - name: test, the mono crates
        run: cargo test --locked $MONO_CRATES
      - name: test, the crates that read and write files
        run: >-
          cargo test --locked -p greycard-core -p greycard-edit
          -p greycard-edit-io -p greycard-lens -p greycard-ai
          -p greycard-library --features mono
      - name: test, the app's windowless modules
        run: cargo test --locked -p greycard-ui --lib --features mono
      - name: test, what is named mono in the pipeline
        run: >-
          cargo test --locked -p greycard-render -p greycard-engine
          -p greycard-viewport --features mono --lib mono

  stock:
    name: stock build unchanged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - *room
      - *native
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: no mono crate in the stock tree
        run: |
          if cargo tree --locked -p greycard-ui -p greycard-cli -e normal --prefix none | grep -E '^mono-'; then
            echo "::error::a stock build depends on a mono crate"
            exit 1
          fi
      - name: build
        run: cargo build --locked -p greycard-ui -p greycard-cli
      - name: no Monocard binary, and Greycard's own sidecars
        run: |
          test ! -e target/debug/monocard
          test ! -e target/debug/monocard-ui
          cargo test --locked -p greycard-edit --test two_apps

  golden:
    name: golden renders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - *room
      - *native
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every test with mono_golden in its name; the reference DNGs are
      # not in the repository (CONTRIBUTING.md), so the ones that need
      # them are ignored tests.
      - name: golden renders
        shell: bash
        run: |
          cargo test --locked -p greycard-engine --features mono mono_golden | tee golden.log
          grep -Eq '^test .*mono_golden.* \.\.\. ok' golden.log ||
            echo "::warning::no golden render ran"

  licenses:
    name: licenses and marks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: scripts/monocard-licenses.sh
